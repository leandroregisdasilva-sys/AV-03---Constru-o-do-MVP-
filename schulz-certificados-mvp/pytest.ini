[pytest]
testpaths = tests
pythonpath = services/metrologia services/web scripts
addopts = -ra --strict-markers
markers =
    e2e: sobe os dois microsserviços de verdade (HTTP real) e testa o fluxo completo
    real: usa planilhas reais da Schulz (somente local; defina SCHULZ_DADOS_REAIS=<pasta>)
filterwarnings =
    ignore::UserWarning:openpyxl
